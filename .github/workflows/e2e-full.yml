name: e2e-full

# The full e2e suite against a real identity stack (TRD 13; plan F7.1):
# nightly, and by hand before a release. Builds identity from a go-identity
# ref so a tagged release can be checked.

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 WIB
  workflow_dispatch:
    inputs:
      identity_ref:
        description: go-identity branch or tag to test against
        default: main
        required: true

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: biairmal/go-identity
          ref: ${{ inputs.identity_ref || 'main' }}
          path: go-identity

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Full suite, single then multi mode
        run: pnpm run e2e:full
        env:
          IDENTITY_BUILD: "1"
          IDENTITY_REPO_PATH: go-identity

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          if-no-files-found: ignore
