{{- if .Values.route.enabled }}
{{- if eq .Values.route.kind "openshift" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "web-starter.fullname" . }}
  labels:
    {{- include "web-starter.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "web-starter.fullname" . }}
  port:
    targetPort: http
  {{- if .Values.route.tls.enabled }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "web-starter.fullname" . }}
  labels:
    {{- include "web-starter.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.route.tls.enabled }}
  tls:
    - hosts: [{{ .Values.route.host | quote }}]
      secretName: {{ .Values.route.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.route.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "web-starter.fullname" . }}
                port:
                  name: http
{{- end }}
{{- end }}
